# Empêche Supabase (plan gratuit) de se mettre en pause quand le café est fermé plusieurs jours.
# À placer dans le dépôt GitHub sous : .github/workflows/keepalive.yml
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'   # tous les 3 jours environ
  workflow_dispatch:          # permet aussi de le lancer à la main
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -f "https://rxgjfaolfznnvkqzounv.supabase.co/rest/v1/menu_items?select=id&limit=1" \
            -H "apikey: sb_publishable__mkqYHMSQgU0JDZH5PahKw_ugMLqOLz"
            
