<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#392518">
<title>Almas — المنيو</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--dark:#392518;--brown:#604127;--gold:#d7ad70;--bg:#f5f0e8;--card:#fffdf9;--ink:#30251b;--muted:#8b7b68;--line:#e9dfd1;--green:#28784c;--red:#b9443b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{position:relative;background:var(--dark);padding:calc(16px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px}
header h1{margin:0;font:400 26px Georgia,serif;letter-spacing:5px;color:var(--gold)}
header p{margin:4px 0 0;color:#ddc9ad;font-size:14px}
main{max-width:640px;margin:auto;padding:12px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.cats button{flex:0 0 auto;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;color:var(--brown)}
.cats button.on{background:var(--dark);color:#ffe5b7;border-color:var(--dark)}
.item,.line{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item .nm,.line .nm{flex:1;min-width:0}
.item b,.line b{display:block;font-size:16px}
.item small,.line small{color:var(--green);font-weight:700}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border:0;border-radius:12px;background:#efe5d7;font-size:22px;font-weight:700;color:var(--dark)}
.qty button.add{background:var(--dark);color:#ffe5b7}
.qty span{min-width:26px;text-align:center;font-weight:800}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;margin-top:6px}
.bar{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:auto}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--dark);color:#ffe5b7;font:inherit;font-size:17px;font-weight:800}
.btn:disabled{opacity:.45}
.btn.gold{background:var(--gold);color:var(--dark)}
.btn.wa{background:#25a15a;color:#fff;display:block;text-align:center;text-decoration:none;line-height:52px}
.btn.light{background:#efe4d5;color:var(--dark)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.st{font-size:20px;font-weight:800;color:var(--dark);margin:6px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0 4px}
.err{color:var(--red);font-weight:700;min-height:22px;margin:8px 0}
#qr svg{width:220px;height:220px;display:block;margin:10px auto}
.hide{display:none!important}
.mute{color:var(--muted);font-size:13px}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ===== v3 : catégories = cartes fixes en haut, une catégorie à la fois ===== */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:visible;margin:0 -12px;padding:10px 12px;border-bottom:1px solid var(--line);box-shadow:0 4px 12px #3925181a}
.cats button{min-height:62px;padding:6px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;line-height:1.15;text-align:center;overflow:hidden}
.cats button .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:22px;overflow:hidden}
.cats button .ci img{width:100%;height:100%;object-fit:cover;display:block}
.cats button.on{box-shadow:0 0 0 2px var(--gold) inset}
#list{padding-top:12px}
.item{padding:10px;gap:12px;align-items:stretch}
.item .ph{width:92px;height:92px;flex:none;border-radius:12px;background:#efe5d7;overflow:hidden;display:grid;place-items:center;font-size:34px}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .nm{display:flex;flex-direction:column;justify-content:center;gap:3px}
.item .nm b{font-size:16px}
.item .nm .ds{color:var(--muted);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .nm small{font-size:15px;color:var(--brown)}
.item .qty{align-self:flex-end}
.qty button{width:40px;height:40px}
/* ===== v4 : vue carreaux (2 par ligne), clic sur la photo = ajouter ===== */
#list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:12px}
.tile{position:relative;display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;font:inherit;color:inherit;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .ph{width:100%;aspect-ratio:1/1;border-radius:12px;background:#efe5d7;overflow:hidden;display:grid;place-items:center;font-size:52px}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{display:block;margin-top:8px;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;margin-top:2px;font-size:15px;font-weight:800;color:var(--brown)}
.tile .bd{position:absolute;top:12px;right:12px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--green);color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 2px 6px #0003}
.tile.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.hint{margin:10px 2px 0;color:var(--muted);font-size:14px;text-align:center}
.cartbox{text-align:right;border-color:var(--green);margin-top:12px}
.cartbox h3{margin:0 0 6px;font-size:16px;color:var(--dark)}
.cl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cl .n{flex:1;min-width:0;font-weight:700}
.cl .q{font-weight:800;color:var(--green)}
.cl .p{color:var(--muted);font-size:14px;min-width:70px;text-align:left}
.cl button{width:36px;height:36px;border:0;border-radius:10px;background:#efe5d7;font-size:20px;font-weight:700;color:var(--red)}
.cartbox .tot{margin:10px 0 0;font-size:17px}
#lang{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;min-height:38px;padding:0 14px;border:1px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-weight:800}
html[dir=ltr] .cartbox{text-align:left}
html[dir=ltr] .cl .p{text-align:right}
</style>
<style>html,body{overscroll-behavior-y:none}
/* ===== Fidélité : compte client + fiche 10 cases ===== */
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;background:#fff;margin:5px 0}
.auth .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px}
.auth .tabs button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:800;color:var(--brown)}
.auth .tabs button.on{background:var(--dark);color:#ffe5b7;border-color:var(--dark)}
.auth .btn{margin-top:8px}
.auth label.ok{display:flex;gap:8px;align-items:flex-start;text-align:start;margin:8px 0;font-size:14px;color:var(--muted)}
.auth label.ok input{width:22px;height:22px;flex:none}
.lcard{text-align:start;border-color:var(--gold);margin:12px 0;padding:12px}
.lcard .lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lcard .lhead a{color:var(--brown);font-weight:700}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.stamps span{aspect-ratio:1/1;border:2px dashed var(--gold);border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.stamps span.on{background:var(--green);border:2px solid var(--green);color:#fff;font-size:20px}
</style></head>

}
const tableLabel = () => bureau ? '🏢 ' + (dv ? dv.n + ' — ' + dv.p : bureau.name) : takeaway ? t('take') + (tableNo ? t('num') + tableNo : '') : t('table') + tableNo;
const tableLabelAr = () => takeaway ? (tableNo ? '🥡 للخارج · رقم ' + tableNo : '🥡 للخارج') : 'طاولة ' + tableNo;   // message WhatsApp du patron : toujours en arabe
const LS = takeaway ? (bureau ? 'almas_order_bureau' : 'almas_order_take') : 'almas_order_' + tableNo;
const H = {apikey: SB_KEY, 'Content-Type': 'application/json'};
if (SB_KEY.startsWith('eyJ')) H.Authorization = 'Bearer ' + SB_KEY; // ancienne clé JWT seulement
const STATUS = new Proxy({}, {get: (_, k) => t('st')[k]});
let items = [], cart = {}, cat = null, orders = [], timer = null;

async function api(path, opt) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers: H, ...opt});
  if (!r.ok) { let e = {}; try { e = await r.json(); } catch (_) {} throw new Error(e.message || r.status); }
  return r.status === 204 ? null : r.json().catch(() => null);
}
const rpc = (fn, body) => api('rpc/' + fn, {method: 'POST', body: JSON.stringify(body)});

// ===== Fidélité : compte client (téléphone + mot de passe) + fiche de 10 cases =====
const CK = 'almas_cust';
let cust = null, auTab = 'login', lastPaid = 0, guest = false;   // guest = mode passager (sans compte), valable pour cette visite
try { guest = sessionStorage.getItem('almas_guest') === '1'; } catch (_) {}
const setGuest = v => { guest = v; try { v ? sessionStorage.setItem('almas_guest', '1') : sessionStorage.removeItem('almas_guest'); } catch (_) {} };
const getTok = () => { try { return localStorage.getItem(CK) || ''; } catch (_) { return ''; } };
const setTok = v => { try { v ? localStorage.setItem(CK, v) : localStorage.removeItem(CK); } catch (_) {} };
const digits8 = s => String(s || '').replace(/\D/g, '').slice(-8);
async function loadMe() {
  const tk = getTok(); if (!tk) { cust = null; return null; }
  try { cust = {token: tk, me: await rpc('customer_me', {p_token: tk})}; }
  catch (e) { if (/session_invalide/.test(e.message)) { setTok(''); cust = null; } else cust = {token: tk, me: cust && cust.me || null}; }   // réseau coupé : on garde la session
  return cust && cust.me;
}
function paintCard() {
  const me = !bureau && cust && cust.me;
  let h = '';
  if (me) {
    const n = Math.min(10, Number(me.stamps) || 0), last = (me.cards || [])[0];
    h = `<div class="box lcard"><div class="lhead"><b>🎁 ${t('loyalTitle')}</b><span class="mute">${t('hello')}${safe(me.first)} · <a href="#" data-lo>${t('logout')}</a></span></div>
      <div class="stamps">${Array.from({length: 10}, (_, i) => `<span class="${i < n ? 'on' : ''}">${i < n ? '✓' : i + 1}</span>`).join('')}</div>
      <div class="mute">${n}/10 · ${t('loyalInfo')}</div>${me.balance > 0 ? `<div style="margin-top:8px;padding:8px 10px;border-radius:10px;background:#e8f3ec;color:var(--green);font-weight:800">${t('balance')}${money(me.balance)}<div class="mute" style="font-weight:400">${t('balanceHint')}</div></div>` : (last ? `<div class="mute" style="margin-top:6px">${t('lastReward')}<b>${money(last.reward)}</b></div>` : '')}</div>`;
  }
  else if (!bureau && guest && !getTok()) h = `<div class="box lcard"><div>${t('guestInvite')}</div><button type="button" class="btn gold" data-reg style="margin-top:8px">${t('guestInviteBtn')}</button></div>`;
  ['lcM', 'lcO'].forEach(id => { const e = $(id); if (e) e.innerHTML = h; });
}
document.addEventListener('click', e => {
  if (!e.target.closest('[data-reg]')) return;
  setGuest(false); auTab = 'reg'; showAuth();
});
document.addEventListener('click', async e => {
  if (!e.target.closest('[data-lo]')) return;
  e.preventDefault();
  const tk = getTok(); try { if (tk) await rpc('customer_logout', {p_token: tk}); } catch (_) {}
  setTok(''); cust = null; location.reload();
});
function paintAuth() {
  $('auTitle').textContent = '🎁 ' + t('loyalTitle'); $('auSub').textContent = t('auSub');
  $('auTL').textContent = t('auHave'); $('auTR').textContent = t('auNew');
  $('auTL').classList.toggle('on', auTab === 'login'); $('auTR').classList.toggle('on', auTab === 'reg');
  $('auLogin').classList.toggle('hide', auTab !== 'login'); $('auReg').classList.toggle('hide', auTab !== 'reg');
  $('alP').placeholder = t('fPhone'); $('alW').placeholder = t('fPass'); $('auLoginGo').textContent = t('auLogin');
  $('arF').placeholder = t('fFirst'); $('arL').placeholder = t('fLast'); $('arP').placeholder = t('fPhone'); $('arC').placeholder = t('fCin');
  $('auGuest').textContent = t('guestBtn');
  $('arDl').textContent = t('fDob'); $('arW').placeholder = t('fPass'); $('arW2').placeholder = t('fPass2'); $('arOkT').textContent = t('consent'); $('auRegGo').textContent = t('auCreate');
  $('auErr').textContent = '';
}
function showAuth() {
  clearInterval(timer);
  $('vMenu').classList.add('hide'); $('vOrder').classList.add('hide'); $('bar').classList.add('hide'); $('vAuth').classList.remove('hide');
  paintAuth();
}
$('auGuest').onclick = () => { setGuest(true); $('vAuth').classList.add('hide'); openMenu(); };
async function authDone(tok) { setTok(tok); setGuest(false); await loadMe(); $('vAuth').classList.add('hide'); openMenu(); }
$('auTL').onclick = () => { auTab = 'login'; paintAuth(); };
$('auTR').onclick = () => { auTab = 'reg'; paintAuth(); };
$('auLoginGo').onclick = async () => {
  const er = $('auErr'), ph = digits8($('alP').value), pw = $('alW').value; er.textContent = '';
  if (ph.length !== 8 || !pw) return er.textContent = t('badLogin');
  $('auLoginGo').disabled = true;
  try {
    const r = await rpc('customer_login', {p_phone: ph, p_pass: pw});
    if (r && r.ok) { $('alW').value = ''; await authDone(r.token); return; }
    er.textContent = r && r.err === 'locked' ? t('locked') : t('badLogin');
  } catch (e) { er.textContent = t('sendFail'); }
  finally { $('auLoginGo').disabled = false; }
};
$('auRegGo').onclick = async () => {
  const er = $('auErr'), f = $('arF').value.trim(), l = $('arL').value.trim(), ph = digits8($('arP').value),
    cin = $('arC').value.replace(/\D/g, ''), dob = $('arD').value, pw = $('arW').value; er.textContent = '';
  if (f.length < 2 || l.length < 2 || ph.length !== 8 || (cin && cin.length !== 8) || !dob || pw.length < 4) return er.textContent = t('badData');
  if (pw !== $('arW2').value) return er.textContent = t('passDiff');
  if (!$('arOk').checked) return er.textContent = t('needConsent');
  $('auRegGo').disabled = true;
  try {
    const r = await rpc('customer_register', {p_first: f, p_last: l, p_phone: ph, p_cin: cin || null, p_dob: dob, p_pass: pw});
    if (r && r.ok) { $('arW').value = ''; $('arW2').value = ''; await authDone(r.token); return; }
    er.textContent = t('badData');
  } catch (e) {
    er.textContent = /telephone_existe|duplicate|unique/i.test(e.message) ? t('phoneUsed') : /donnees_invalides/.test(e.message) ? t('badData') : t('sendFail');
  } finally { $('auRegGo').disabled = false; }
};
// rattache chaque commande au client connecté (la case se coche côté serveur quand la table est payée)
async function linkOrders() {
  const tk = getTok(); if (!tk || bureau) return;
  for (const o of orders) {
    if (o.linked || o.status === 'annulee') continue;
    try { await rpc('customer_link_order', {p_token: tk, p_order: o.id}); o.linked = true; }
    catch (e) { if (/session_invalide/.test(e.message)) break; }
  }
  saveOrders();
}
const saveOrders = () => { try { orders.length ? localStorage.setItem(LS, JSON.stringify(orders)) : localStorage.removeItem(LS); } catch (_) {} };
const loadOrders = () => { try { const v = JSON.parse(localStorage.getItem(LS)); return Array.isArray(v) ? v : (v ? [v] : []); } catch (_) { return []; } };

const EMO = [[/caf|expr|capp|nes/i,'☕'],[/th[eé]|tea|ma3|menth/i,'🍵'],[/froid|glac|cold|smooth|milk/i,'🧊'],[/jus|juice|orange/i,'🍊'],[/dess|g[aâ]t|cake|crep|pat/i,'🍰'],[/sand|burger|pizza|snack|tacos/i,'🥪']];
const emo = c => (EMO.find(([r]) => r.test(c)) || [0,'🍽️'])[1];
function renderMenu() {
  const cats = [...new Set(items.map(i => i.category))];
  if (!cat || !cats.includes(cat)) cat = cats[0];
  $('cats').innerHTML = cats.map(c => {
    const im = (items.find(i => i.category === c && i.image_url) || {}).image_url;
    return `<button class="${c === cat ? 'on' : ''}" data-cat="${safe(c)}"><span class="ci">${im ? `<img src="${safe(im)}" alt="" onerror="this.parentNode.textContent='${emo(c)}'">` : emo(c)}</span>${safe(catName(c))}</button>`;
  }).join('');
  $('list').innerHTML = items.filter(i => i.category === cat).map(i => `<button type="button" class="tile" data-id="${i.id}">
      <div class="ph">${i.image_url ? `<img loading="lazy" src="${safe(i.image_url)}" alt="${safe(i.name)}" onerror="this.parentNode.textContent='${emo(i.category)}'">` : emo(i.category)}<span class="bd hide"></span></div>
      <b>${safe(nm(i))}</b><small>${money(i.price_millimes)}</small></button>`).join('');
  refresh();
}
function refresh() {
  document.querySelectorAll('#list .tile').forEach(el => {
    const q = cart[el.dataset.id] || 0, bd = el.querySelector('.bd');
    el.classList.toggle('on', q > 0); bd.classList.toggle('hide', !q); bd.textContent = q;
  });
  const sel = items.filter(i => cart[i.id]);
  const cb = $('cartBox');
  cb.classList.toggle('hide', !sel.length);
  cb.innerHTML = sel.length ? '<h3>' + t('yourOrder') + '</h3>' + sel.map(i => `<div class="cl"><span class="n">${safe(nm(i))}</span><span class="q">× ${cart[i.id]}</span><span class="p">${money(i.price_millimes * cart[i.id])}</span><button type="button" data-dec="${i.id}" aria-label="نقص">−</button></div>`).join('')
    + `<div class="tot"><span>${t('total')}</span><span>${money(sel.reduce((t, i) => t + i.price_millimes * cart[i.id], 0))}</span></div>` : '';
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  const tot = items.reduce((s, i) => s + (cart[i.id] || 0) * i.price_millimes, 0);
  $('bSend').disabled = !n;
  $('bSend').textContent = n ? `${t('send')} · ${n} · ${money(tot)}` : t('send');
}
$('cats').onclick = e => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; renderMenu(); scrollTo(0, 0); } };
$('list').onclick = e => {
  const t = e.target.closest('[data-id]');
  if (t) cart[t.dataset.id] = Math.min((cart[t.dataset.id] || 0) + 1, 20);
  refresh();
};
$('cartBox').onclick = e => {
  const dec = e.target.closest('[data-dec]');
  if (dec) { const id = dec.dataset.dec; cart[id] = (cart[id] || 1) - 1; if (cart[id] <= 0) delete cart[id]; }
  refresh();
};

// Note envoyée au serveur : pour les bureaux « 🏢 lieu — détail | nom » (lue par la caisse pour nommer le ticket)
const noteFor = () => {
  const nt = $('note').value.trim();
  if (bureau && dv) return ('🏢 ' + dv.p + (dv.d ? ' — ' + dv.d : '') + ' | ' + dv.n + (nt ? '\n' + nt : '')).slice(0, 300);
  return ((takeaway ? '🥡 EMPORTER ' : '') + nt).trim() || null;
};
$('bSend').onclick = async () => {
  $('err').textContent = '';
  $('bSend').disabled = true;
  const lines = items.filter(i => cart[i.id]).map(i => ({name: i.name, nameFr: i.name_fr || '', price: i.price_millimes, qty: cart[i.id]}));
  try {
    const res = await rpc('place_order', {
      p_table: takeaway ? 0 : tableNo,
      p_key: qkey,
      p_items: Object.entries(cart).map(([id, qty]) => ({id, qty})),
      p_note: noteFor()
    });
    if (takeaway) { tableNo = res[0].o_table; try { localStorage.setItem(TK, tableNo); } catch (_) {} }
    orders.push({id: res[0].o_id, total: res[0].o_total, lines, status: 'nouvelle', bill: false, t: Date.now()});
    saveOrders(); cart = {}; $('note').value = ''; linkOrders();
    showOrder();
  } catch (e) {
    $('err').textContent = /cle_invalide/.test(e.message)
      ? t('badKey')
      : /trop_de_commandes/.test(e.message)
        ? (takeaway ? t('tooManyTk') : t('tooMany'))
        : t('sendFail');
    renderMenu();
  }
};

function showOrder() {
  $('vMenu').classList.add('hide'); $('bar').classList.add('hide'); $('vOrder').classList.remove('hide');
  $('oTable').textContent = tableLabel();
  paint(); paintCard(); poll(); clearInterval(timer); timer = setInterval(poll, 5000);
}

function paint() {
  const live = orders.filter(o => o.status !== 'annulee');
  const open = live.filter(o => o.status !== 'payee');
  const done = !open.length;
  const asked = open.length > 0 && open.every(o => o.bill);
  $('oStatus').textContent = done ? (live.length ? STATUS.payee : STATUS.annulee) : (asked ? t('billReady') : bureau ? t('dvOrders') : t('tableOrders'));
  $('oLines').innerHTML = orders.map((o, i) =>
    `<div class="mute" style="margin:12px 4px 6px">${t('orderN')}${i + 1} — ${safe(STATUS[o.status] || o.status)}</div>` +
    o.lines.map(l => `<div class="line"${o.status === 'annulee' ? ' style="opacity:.45"' : ''}><div class="nm"><b>${safe(lang === 'fr' && l.nameFr ? l.nameFr : l.name)}</b><small>${money(l.price)}</small></div><b>× ${l.qty}</b></div>`).join('')
  ).join('');
  $('oTotal').textContent = money(live.reduce((s, o) => s + o.total, 0));
  $('bBill').classList.toggle('hide', done || asked || !!bureau);
  $('bAdd').classList.toggle('hide', done || asked);
  $('bNew').classList.toggle('hide', !(done || takeaway));
  $('bNew').textContent = done ? t('newOrder') : t('newOrder2');
  $('billBox').classList.toggle('hide', done || !asked);
  if (!done && asked) drawBill(open);
  if (done) clearInterval(timer);
}

// Le QR et le message WhatsApp regroupent TOUTES les commandes non payées de la table.
function drawBill(open) {
  const ids = open.map(o => o.id);
  try { const q = qrcode(0, 'M'); q.addData('almas:' + ids.join(',')); q.make(); $('qr').innerHTML = q.createSvgTag({scalable: true}); }
  catch (_) { $('qr').textContent = ids.join(' '); }
  const m = {};
  open.forEach(o => o.lines.forEach(l => { const k = l.name + '|' + l.price; m[k] = m[k] || {name: l.name, price: l.price, qty: 0}; m[k].qty += l.qty; }));
  const msg = ['حساب — ' + tableLabelAr(), ...Object.values(m).map(l => `${l.name} × ${l.qty}  ${money(l.price * l.qty)}`),
    'المجموع: ' + money(open.reduce((s, o) => s + o.total, 0)), 'كود: ' + ids.map(i => i.slice(0, 8)).join(' ')].join('\n');
  $('wa').href = 'https://wa.me/' + OWNER_WA + '?text=' + encodeURIComponent(msg);
}

async function syncStatuses() {
  if (!orders.length) return;
  await Promise.all(orders.map(async o => {
    if (o.status === 'payee' || o.status === 'annulee') return;
    try {
      const r = (await rpc('order_status', {p_id: o.id}))[0];
      if (!r) { o.status = 'annulee'; return; }
      o.status = r.s_status; o.total = r.s_total; o.bill = r.s_bill;
    } catch (_) {}
  }));
  saveOrders();
}
async function poll() {
  await linkOrders(); await syncStatuses();
  const paid = orders.filter(o => o.status === 'payee').length;
  if (paid !== lastPaid) { lastPaid = paid; if (!bureau) await loadMe(); paintCard(); }   // une commande vient d'être payée : la case est cochée
  paint();
}

$('bBill').onclick = async () => {
  $('err2').textContent = '';
  const open = orders.filter(o => o.status !== 'annulee' && o.status !== 'payee');
  try { await Promise.all(open.map(o => rpc('request_bill', {p_id: o.id}))); open.forEach(o => o.bill = true); saveOrders(); paint(); }
  catch (_) { $('err2').textContent = t('billFail'); }
};
$('bNew').onclick = () => { if (orders.some(o => o.status !== 'payee' && o.status !== 'annulee') && !confirm(t('confirmNew'))) return; orders = []; saveOrders(); if (takeaway) { try { localStorage.removeItem(TK); } catch (_) {} } location.reload(); };

// ===== Livraison aux bureaux : nom + emplacement (mémorisés sur le téléphone du client) =====
function paintDv() {
  if (!bureau) return;
  $('dvTitle').textContent = t('dvTitle');
  $('dvSub').textContent = (bureau.name ? '🏢 ' + bureau.name + ' — ' : '') + t('dvSub');
  $('dvN').placeholder = t('dvName'); $('dvD').placeholder = t('dvDetail'); $('dvGo').textContent = t('dvGo');
  $('dvP').innerHTML = '<option value="">' + safe(t('dvPick')) + '</option>' + bureau.places.map(p => '<option' + (dv && dv.p === p ? ' selected' : '') + '>' + safe(p) + '</option>').join('');
  $('dvEdit').textContent = t('dvEdit'); $('dvEditLn').classList.toggle('hide', !dv);
}
function showDeliv() {
  clearInterval(timer);
  ['vMenu', 'vOrder', 'vAuth', 'bar'].forEach(id => $(id).classList.add('hide'));
  $('vDeliv').classList.remove('hide');
  paintDv(); $('dvN').value = dv ? dv.n : ''; $('dvD').value = dv && dv.d || ''; $('dvErr').textContent = '';
}
$('dvEdit').onclick = e => { e.preventDefault(); showDeliv(); };
$('dvGo').onclick = () => {
  const n = $('dvN').value.trim(), p = $('dvP').value, d = $('dvD').value.trim();
  if (n.length < 2 || !p) { $('dvErr').textContent = t('dvNeed'); return; }
  dv = {n: n.replace(/\|/g, '/'), p, d: d.replace(/\|/g, '/')};
  try { localStorage.setItem('almas_bureau_info', JSON.stringify(dv)); } catch (_) {}
  $('vDeliv').classList.add('hide'); $('hd').textContent = tableLabel(); openMenu();
};

async function openMenu() {
  if (!bureau && !cust) await loadMe();
  if (bureau && !dv) { showDeliv(); return; }
  if (!bureau && !getTok() && !guest) { showAuth(); return; }              // pas de compte : on demande de se connecter ou de créer un compte
  if (!items.length) {
    try {
      try { try { items = await api('menu_items?select=id,name,name_fr,price_millimes,category,image_url,description&available=eq.true&order=sort'); } catch (_0) { items = await api('menu_items?select=id,name,price_millimes,category,image_url,description&available=eq.true&order=sort'); } }
      catch (_) { items = await api('menu_items?select=id,name,price_millimes,category&available=eq.true&order=sort'); }  // colonnes photo/description pas encore créées
    }
    catch (_) {
      if (orders.length) { $('err2').textContent = t('menuFail'); return; }
      $('list').innerHTML = '<div class="box">' + t('menuFail2') + '</div>'; return;
    }
  }
  clearInterval(timer);
  $('vOrder').classList.add('hide'); $('vMenu').classList.remove('hide'); $('bar').classList.remove('hide');
  $('bBack').classList.toggle('hide', !orders.length);
  paintCard(); paintDv();
  renderMenu();
}
$('bAdd').onclick = openMenu;
$('bBack').onclick = showOrder;


function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'fr' ? 'ltr' : 'rtl';
  $('lang').textContent = t('other'); $('hint').textContent = t('hint'); $('note').placeholder = t('note');
  $('bBack').textContent = t('back'); $('bAdd').textContent = t('addOrder'); $('bBill').textContent = t('bill');
  paintCard(); paintDv(); if (!$('vAuth').classList.contains('hide')) paintAuth();
  $('oTotLbl').textContent = t('total'); $('bbTitle').textContent = t('billReady'); $('bbHint').textContent = t('showCode'); $('wa').textContent = t('wa');
  if (scanMode) $('hd').textContent = t('scan'); else if (takeaway || tableNo) $('hd').textContent = tableLabel(); else $('hd').textContent = t('menu');
  if (!$('vMenu').classList.contains('hide') && items.length) renderMenu(); else refresh();
  if (!$('vOrder').classList.contains('hide')) { $('oTable').textContent = tableLabel(); paint(); }
}
$('lang').onclick = () => { lang = lang === 'fr' ? 'ar' : 'fr'; try { localStorage.setItem('almas_lang', lang); } catch (_) {} applyLang(); };

(async function init() {
  applyLang();
  if ((!takeaway && !tableNo) || (!qkey && !loadOrders().length)) {
    scanMode = true; $('hd').textContent = t('scan');
    $('vMenu').classList.add('hide'); $('bar').classList.add('hide'); return;
  }
  orders = loadOrders().filter(o => !o.t || Date.now() - o.t < 12 * 36e5);   // commandes de plus de 12 h : oubliées
  if (orders.length) await syncStatuses();                                   // statut à jour avant d'afficher
  if (orders.every(o => o.status === 'payee' || o.status === 'annulee')) {   // tout est payé : nouveau client
    orders = []; saveOrders();
    if (takeaway) { tableNo = 0; try { localStorage.removeItem(TK); } catch (_) {} }
  }
  $('hd').textContent = tableLabel();
  if (!bureau && getTok()) await loadMe();
  if (orders.length) showOrder(); else openMenu();
})();
</script>
</body>
</html>
