<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#392518">
<title>Almas — المنيو</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--dark:#392518;--brown:#604127;--gold:#d7ad70;--bg:#f5f0e8;--card:#fffdf9;--ink:#30251b;--muted:#8b7b68;--line:#e9dfd1;--green:#28784c;--red:#b9443b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{background:var(--dark);padding:calc(16px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px}
header h1{margin:0;font:400 26px Georgia,serif;letter-spacing:5px;color:var(--gold)}
header p{margin:4px 0 0;color:#ddc9ad;font-size:14px}
main{max-width:640px;margin:auto;padding:12px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.cats button{flex:0 0 auto;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;color:var(--brown)}
.cats button.on{background:var(--dark);color:#ffe5b7;border-color:var(--dark)}
.item,.line{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item .nm,.line .nm{flex:1;min-width:0}
.item b,.line b{display:block;font-size:16px}
.item small,.line small{color:var(--green);font-weight:700}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border:0;border-radius:12px;background:#efe5d7;font-size:22px;font-weight:700;color:var(--dark)}
.qty button.add{background:var(--dark);color:#ffe5b7}
.qty span{min-width:26px;text-align:center;font-weight:800}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;margin-top:6px}
.bar{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:auto}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--dark);color:#ffe5b7;font:inherit;font-size:17px;font-weight:800}
.btn:disabled{opacity:.45}
.btn.gold{background:var(--gold);color:var(--dark)}
.btn.wa{background:#25a15a;color:#fff;display:block;text-align:center;text-decoration:none;line-height:52px}
.btn.light{background:#efe4d5;color:var(--dark)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.st{font-size:20px;font-weight:800;color:var(--dark);margin:6px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0 4px}
.err{color:var(--red);font-weight:700;min-height:22px;margin:8px 0}
#qr svg{width:220px;height:220px;display:block;margin:10px auto}
.hide{display:none!important}
.mute{color:var(--muted);font-size:13px}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ===== v2 : catégories fixes + articles avec photo ===== */
.cats{margin:0 -12px;padding:10px 12px;border-bottom:1px solid var(--line);box-shadow:0 4px 12px #3925180f}
.cats button{transition:.15s}
.sec{scroll-margin-top:70px;margin-bottom:18px}
.sec h2{margin:14px 4px 10px;font:400 22px Georgia,serif;color:var(--dark);display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.item{padding:10px;gap:12px;align-items:stretch}
.item .ph{width:92px;height:92px;flex:none;border-radius:12px;background:#efe5d7;overflow:hidden;display:grid;place-items:center;font-size:34px}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .nm{display:flex;flex-direction:column;justify-content:center;gap:3px}
.item .nm b{font-size:16px}
.item .nm .ds{color:var(--muted);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .nm small{font-size:15px;color:var(--brown)}
.item .qty{align-self:flex-end}
.qty button{width:40px;height:40px}
</style>
</head>
<body>
<header><h1>ALMAS</h1><p id="hd">المنيو</p></header>
<main>
  <section id="vMenu">
    <div class="cats" id="cats"></div>
    <div id="list"></div>
    <textarea id="note" rows="2" maxlength="200" placeholder="ملاحظة (اختياري)، مثلا: بلا سكر"></textarea>
    <div class="err" id="err"></div>
    <button class="btn light hide" id="bBack" style="margin-top:8px">رجوع للكوموندات</button>
  </section>
  <section id="vOrder" class="hide">
    <div class="box"><div class="mute" id="oTable"></div><div class="st" id="oStatus">…</div></div>
    <div id="oLines"></div>
    <div class="tot"><span>المجموع</span><span id="oTotal"></span></div>
    <div class="err" id="err2"></div>
    <button class="btn gold" id="bBill">اطلب الحساب</button>
    <button class="btn light hide" id="bAdd" style="margin-top:12px">زيد كوموند</button>
    <div id="billBox" class="box hide" style="margin-top:12px">
      <div class="st">الحساب جاهز</div>
      <div class="mute">وري هالكود للنادل باش يخلّص</div>
      <div id="qr"></div>
      <a class="btn wa" id="wa" target="_blank" rel="noopener">ابعث الحساب في واتساب</a>
    </div>
    <button class="btn light hide" id="bNew" style="margin-top:12px">كوموند جديدة</button>
  </section>
</main>
<div class="bar" id="bar"><div class="in"><button class="btn" id="bSend" disabled>ابعث الكوموند</button></div></div>

<script>
// ===== À CONFIGURER =====
const SB_URL = 'https://rxgjfaolfznnvkqzounv.supabase.co';
const SB_KEY = 'sb_publishable__mkqYHMSQgU0JDZH5PahKw_ugMLqOLz';      // clé "anon" uniquement, JAMAIS la clé service_role
const OWNER_WA = '21624888838';       // numéro WhatsApp du patron, sans + ni espaces
// ========================

const $ = id => document.getElementById(id);
const safe = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n / 1000).toFixed(3) + ' د.ت';
let tableNo = parseInt(new URLSearchParams(location.search).get('table'), 10);
const qs = new URLSearchParams(location.search);
const qkey = qs.get('k') || '';                              // clé secrète du QR (vérifiée côté serveur)
const takeaway = qs.get('emporter') === '1';                 // QR « à emporter » : ?table=N&emporter=1
const TK = 'almas_take_no';
if (takeaway) {   // le numéro de ticket est attribué par le serveur à la 1re commande
  tableNo = 0; try { tableNo = parseInt(localStorage.getItem(TK), 10) || 0; } catch (_) {}
}
const tableLabel = () => takeaway ? (tableNo ? '🥡 للخارج · رقم ' + tableNo : '🥡 للخارج') : 'طاولة ' + tableNo;
const LS = takeaway ? 'almas_order_take' : 'almas_order_' + tableNo;
const H = {apikey: SB_KEY, 'Content-Type': 'application/json'};
if (SB_KEY.startsWith('eyJ')) H.Authorization = 'Bearer ' + SB_KEY; // ancienne clé JWT seulement
const STATUS = {
  nouvelle: 'الكوموند وصلت، في الانتظار',
  acceptee: 'قيد التحضير',
  servie: 'تخدمت، بالصحة',
  payee: 'خالصة، يعيشك',
  annulee: 'الكوموند تلغات'
};
let items = [], cart = {}, cat = null, orders = [], timer = null;

async function api(path, opt) {
  const r = await fetch(SB_URL + '/rest/v1/' + path, {headers: H, ...opt});
  if (!r.ok) { let e = {}; try { e = await r.json(); } catch (_) {} throw new Error(e.message || r.status); }
  return r.status === 204 ? null : r.json().catch(() => null);
}
const rpc = (fn, body) => api('rpc/' + fn, {method: 'POST', body: JSON.stringify(body)});
const saveOrders = () => { try { orders.length ? localStorage.setItem(LS, JSON.stringify(orders)) : localStorage.removeItem(LS); } catch (_) {} };
const loadOrders = () => { try { const v = JSON.parse(localStorage.getItem(LS)); return Array.isArray(v) ? v : (v ? [v] : []); } catch (_) { return []; } };

function renderMenu() {
  const cats = [...new Set(items.map(i => i.category))];
  if (!cat || !cats.includes(cat)) cat = cats[0];
  $('cats').innerHTML = cats.map((c, k) => `<button class="${c === cat ? 'on' : ''}" data-cat="${k}">${safe(c)}</button>`).join('');
  $('list').innerHTML = cats.map((c, k) => `<section class="sec" id="sec${k}" data-name="${safe(c)}"><h2>${safe(c)}</h2>` +
    items.filter(i => i.category === c).map(i => `<div class="item" data-id="${i.id}">
      <div class="ph">${i.image_url ? `<img loading="lazy" src="${safe(i.image_url)}" alt="${safe(i.name)}" onerror="this.parentNode.textContent='☕'">` : '☕'}</div>
      <div class="nm"><b>${safe(i.name)}</b>${i.description ? `<span class="ds">${safe(i.description)}</span>` : ''}<small>${money(i.price_millimes)}</small></div>
      <div class="qty"></div></div>`).join('') + '</section>').join('');
  refresh();
}
function refresh() {
  document.querySelectorAll('#list .item').forEach(el => {
    const id = el.dataset.id, q = cart[id] || 0;
    el.querySelector('.qty').innerHTML = (q ? `<button data-dec="${id}" aria-label="نقص">−</button><span>${q}</span>` : '') + `<button class="add" data-inc="${id}" aria-label="زيد">+</button>`;
  });
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  const tot = items.reduce((s, i) => s + (cart[i.id] || 0) * i.price_millimes, 0);
  $('bSend').disabled = !n;
  $('bSend').textContent = n ? `ابعث الكوموند · ${n} · ${money(tot)}` : 'ابعث الكوموند';
}
function setActive(k) {
  const bs = $('cats').children; if (!bs[k] || bs[k].classList.contains('on')) return;
  [...bs].forEach(b => b.classList.remove('on')); bs[k].classList.add('on');
  $('cats').scrollTo({left: bs[k].offsetLeft - $('cats').clientWidth / 2 + bs[k].offsetWidth / 2, behavior: 'smooth'});
}
let lock = 0;
addEventListener('scroll', () => {
  if (Date.now() < lock || $('vMenu').classList.contains('hide')) return;
  const secs = [...document.querySelectorAll('.sec')]; let k = 0;
  secs.forEach((el, i) => { if (el.getBoundingClientRect().top <= 90) k = i; });
  setActive(k);
}, {passive: true});

$('cats').onclick = e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  lock = Date.now() + 700; setActive(+b.dataset.cat);
  $('sec' + b.dataset.cat).scrollIntoView({behavior: 'smooth', block: 'start'});
};
$('list').onclick = e => {
  const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]');
  if (inc) cart[inc.dataset.inc] = Math.min((cart[inc.dataset.inc] || 0) + 1, 20);
  if (dec) { const id = dec.dataset.dec; cart[id] = (cart[id] || 1) - 1; if (cart[id] <= 0) delete cart[id]; }
  refresh();
};

$('bSend').onclick = async () => {
  $('err').textContent = '';
  $('bSend').disabled = true;
  const lines = items.filter(i => cart[i.id]).map(i => ({name: i.name, price: i.price_millimes, qty: cart[i.id]}));
  try {
    const res = await rpc('place_order', {
      p_table: takeaway ? 0 : tableNo,
      p_key: qkey,
      p_items: Object.entries(cart).map(([id, qty]) => ({id, qty})),
      p_note: ((takeaway ? '🥡 EMPORTER ' : '') + $('note').value.trim()).trim() || null
    });
    if (takeaway) { tableNo = res[0].o_table; try { localStorage.setItem(TK, tableNo); } catch (_) {} }
    orders.push({id: res[0].o_id, total: res[0].o_total, lines, status: 'nouvelle', bill: false});
    saveOrders(); cart = {}; $('note').value = '';
    showOrder();
  } catch (e) {
    $('err').textContent = /cle_invalide/.test(e.message)
      ? 'الكود موش صالح. امسح الـQR الموجود على الطاولة.'
      : /trop_de_commandes/.test(e.message)
        ? (takeaway ? 'فما برشة كوموندات للخارج في الانتظار. كلّم النادل.' : 'فما برشة كوموندات في الانتظار على هالطاولة. نادي النادل.')
        : 'ما تبعثتش الكوموند. عاود جرّب.';
    renderMenu();
  }
};

function showOrder() {
  $('vMenu').classList.add('hide'); $('bar').classList.add('hide'); $('vOrder').classList.remove('hide');
  $('oTable').textContent = tableLabel();
  paint(); poll(); clearInterval(timer); timer = setInterval(poll, 5000);
}

function paint() {
  const live = orders.filter(o => o.status !== 'annulee');
  const open = live.filter(o => o.status !== 'payee');
  const done = !open.length;
  const asked = open.length > 0 && open.every(o => o.bill);
  $('oStatus').textContent = done ? (live.length ? STATUS.payee : STATUS.annulee) : (asked ? 'الحساب جاهز' : 'كوموندات الطاولة');
  $('oLines').innerHTML = orders.map((o, i) =>
    `<div class="mute" style="margin:12px 4px 6px">كوموند ${i + 1} — ${safe(STATUS[o.status] || o.status)}</div>` +
    o.lines.map(l => `<div class="line"${o.status === 'annulee' ? ' style="opacity:.45"' : ''}><div class="nm"><b>${safe(l.name)}</b><small>${money(l.price)}</small></div><b>× ${l.qty}</b></div>`).join('')
  ).join('');
  $('oTotal').textContent = money(live.reduce((s, o) => s + o.total, 0));
  $('bBill').classList.toggle('hide', done || asked);
  $('bAdd').classList.toggle('hide', done || asked);
  $('bNew').classList.toggle('hide', !(done || takeaway));
  $('bNew').textContent = done ? 'كوموند جديدة' : 'حريف آخر؟ كوموند جديدة';
  $('billBox').classList.toggle('hide', done || !asked);
  if (!done && asked) drawBill(open);
  if (done) clearInterval(timer);
}

// Le QR et le message WhatsApp regroupent TOUTES les commandes non payées de la table.
function drawBill(open) {
  const ids = open.map(o => o.id);
  try { const q = qrcode(0, 'M'); q.addData('almas:' + ids.join(',')); q.make(); $('qr').innerHTML = q.createSvgTag({scalable: true}); }
  catch (_) { $('qr').textContent = ids.join(' '); }
  const m = {};
  open.forEach(o => o.lines.forEach(l => { const k = l.name + '|' + l.price; m[k] = m[k] || {name: l.name, price: l.price, qty: 0}; m[k].qty += l.qty; }));
  const msg = ['حساب — ' + tableLabel(), ...Object.values(m).map(l => `${l.name} × ${l.qty}  ${money(l.price * l.qty)}`),
    'المجموع: ' + money(open.reduce((s, o) => s + o.total, 0)), 'كود: ' + ids.map(i => i.slice(0, 8)).join(' ')].join('\n');
  $('wa').href = 'https://wa.me/' + OWNER_WA + '?text=' + encodeURIComponent(msg);
}

async function poll() {
  if (!orders.length) return;
  await Promise.all(orders.map(async o => {
    if (o.status === 'payee' || o.status === 'annulee') return;
    try {
      const r = (await rpc('order_status', {p_id: o.id}))[0];
      if (!r) { o.status = 'annulee'; return; }
      o.status = r.s_status; o.total = r.s_total; o.bill = r.s_bill;
    } catch (_) {}
  }));
  saveOrders(); paint();
}

$('bBill').onclick = async () => {
  $('err2').textContent = '';
  const open = orders.filter(o => o.status !== 'annulee' && o.status !== 'payee');
  try { await Promise.all(open.map(o => rpc('request_bill', {p_id: o.id}))); open.forEach(o => o.bill = true); saveOrders(); paint(); }
  catch (_) { $('err2').textContent = 'ما تبعثش الطلب. عاود جرّب.'; }
};
$('bNew').onclick = () => { if (orders.some(o => o.status !== 'payee' && o.status !== 'annulee') && !confirm('تخلّي هالكوموند وتبدا وحدة جديدة؟')) return; orders = []; saveOrders(); if (takeaway) { try { localStorage.removeItem(TK); } catch (_) {} } location.reload(); };

async function openMenu() {
  if (!items.length) {
    try {
      try { items = await api('menu_items?select=id,name,price_millimes,category,image_url,description&available=eq.true&order=sort'); }
      catch (_) { items = await api('menu_items?select=id,name,price_millimes,category&available=eq.true&order=sort'); }  // colonnes photo/description pas encore créées
    }
    catch (_) {
      if (orders.length) { $('err2').textContent = 'المنيو ما تحمّلش. عاود جرّب.'; return; }
      $('list').innerHTML = '<div class="box">المنيو ما تحمّلش. حدّث الصفحة.</div>'; return;
    }
  }
  clearInterval(timer);
  $('vOrder').classList.add('hide'); $('vMenu').classList.remove('hide'); $('bar').classList.remove('hide');
  $('bBack').classList.toggle('hide', !orders.length);
  renderMenu();
}
$('bAdd').onclick = openMenu;
$('bBack').onclick = showOrder;

(async function init() {
  if ((!takeaway && !tableNo) || (!qkey && !loadOrders().length)) {
    $('hd').textContent = 'امسح الـQR الموجود على الطاولة';
    $('vMenu').classList.add('hide'); $('bar').classList.add('hide'); return;
  }
  orders = loadOrders();
  if (takeaway && orders.every(o => o.status === 'payee' || o.status === 'annulee')) {   // ancien ticket fini : nouveau client
    orders = []; saveOrders(); tableNo = 0; try { localStorage.removeItem(TK); } catch (_) {}
  }
  $('hd').textContent = tableLabel();
  if (orders.length) showOrder(); else openMenu();
})();
</script>
</body>
</html>
